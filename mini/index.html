<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f8fd">
<meta name="description" content="Airdrop Museum — ruang riset, katalog airdrop, quest, portofolio, dan profil.">
<title>Airdrop Museum — The Open Collection</title>
<link rel="stylesheet" href="/mini.css?v=20261118-legacy-look1">
</head>
<body>
<div class="legacy-frame">
  <aside class="legacy-aside" aria-label="Ruang riset">
    <div class="legacy-aside-brand"><span class="legacy-logo" aria-hidden="true">◈</span><span>AIRDROP<b>MUSEUM</b></span></div>
    <p class="legacy-aside-overline">YOUR RESEARCH SPACE</p>
    <div id="legacy-desktop-tabs" class="legacy-desktop-tabs"></div>
    <div class="legacy-aside-bottom">
      <div class="legacy-orb" aria-hidden="true"></div>
      <span class="legacy-aside-overline">THE MUSEUM PRINCIPLE</span>
      <h2>Bukti, bukan janji.</h2>
      <p>Amati. Dokumentasikan. Nilai.<br>Penilaian Anda penting.</p>
      <span class="legacy-network">● Mode riset pribadi</span>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar" aria-label="Airdrop Museum">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div class="brand-copy"><strong>Airdrop <span>Museum</span></strong></div>
      </div>
      <form class="legacy-global-search" role="search">
        <span aria-hidden="true">⌕</span>
        <input data-legacy-search type="search" placeholder="Cari airdrop, chain, atau proyek…" aria-label="Cari airdrop dan proyek" enterkeyhint="search" autocomplete="off">
      </form>
      <div class="legacy-header-right">
        <span class="topbar-status"><i aria-hidden="true"></i><span>Ruang riset pribadi</span></span>
        <button id="legacy-profile-top" type="button" aria-label="Buka profil" title="Profil">M</button>
      </div>
    </header>
    <form class="legacy-mobile-search" role="search">
      <span aria-hidden="true">⌕</span>
      <input data-legacy-search type="search" placeholder="Cari airdrop, chain, atau proyek…" aria-label="Cari proyek atau jaringan" enterkeyhint="search" autocomplete="off">
      <button type="submit">Cari</button>
    </form>
    <main id="main" tabindex="-1">
      <div id="view-head" class="view-head"></div>
      <section id="content" aria-live="polite" aria-atomic="false"></section>
      <footer class="footnote">Airdrop Museum © 2026 · Data riset bukan jaminan eligibility atau reward. Jangan bagikan seed phrase.</footer>
    </main>
  </div>
</div>
<nav class="bottom-nav" aria-label="Menu utama"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/mini.js?v=20261118-legacy-look1"></script>
</body>
</html>
