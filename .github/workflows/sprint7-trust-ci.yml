name: Sprint 7 Source Trust CI
on:
  push:
    branches:
      - feat/sprint-7-source-trust
  pull_request:
    paths:
      - "src/trust/**"
      - "migrations/0011_source_trust.sql"
      - "tests/trust.test.mjs"
      - "src/api.mjs"
      - "scripts/build-worker.mjs"
      - "dist/trust*"
      - "package.json"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
