name: Production release evidence (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-release-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical release procedure
        run: |
          echo 'Production changes require scripts/release-production.mjs on an operator workstation.'
          echo 'Complete docs/CONTROLLED_PRODUCTION_RELEASE.md including private restore and current commit evidence.'
          exit 1
