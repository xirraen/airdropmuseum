name: Deploy production (approved)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-airdrop-museum
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: node scripts/security-scan.mjs
      - run: node --experimental-sqlite scripts/validate-migrations.mjs
      - run: npm run build
      - run: npm test
      - name: Deploy only after production environment approval and migration check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
