name: Sprint 5 verification
on:
  push:
    branches: [feat/sprint5-portfolio-intelligence]
  pull_request:
    paths:
      - 'src/**'
      - 'dist/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'wrangler.jsonc'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
