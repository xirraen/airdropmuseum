name: Sprint 6 validation
on:
  pull_request:
  push:
    branches:
      - feat/sprint-6-discovery-automation
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
